[project]
name = "agenttree"
version = "0.1.0"
description = "Recursive tree-based browser automation framework with adaptive redundancy and majority voting"
readme = "README.md"
authors = [
    { name = "yravan", email = "yajvanravan@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0",
    "aiosqlite>=0.19",
    "websockets>=12.0",
    "pydantic>=2.0",
    "pydantic-settings[yaml]>=2.0",
    "tokencost>=0.1",
    "dspy>=2.6",
    "tenacity>=8.0",
    "aiolimiter>=1.0",
    "rich>=13.0",
    "structlog>=23.0",
    "tiktoken>=0.5",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.2",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "freezegun>=1.3",
]

[project.scripts]
agenttree = "agenttree.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
timeout = 30
markers = [
    "unit: Pure logic, no I/O",
    "integration: Uses real SQLite, filesystem, or local WebSocket",
    "e2e: Full pipeline tests (may be slow)",
    "slow: Tests that take >10 seconds",
    "browser: Requires Chrome extension running",
]
filterwarnings = ["ignore::DeprecationWarning"]

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

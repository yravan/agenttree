[project]
name = "agenttree"
version = "0.1.0"
description = "Recursive tree-based browser automation framework with adaptive redundancy and majority voting"
readme = "README.md"
authors = [
    { name = "yravan", email = "yajvanravan@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0",
    "aiosqlite>=0.19",
    "websockets>=12.0",
    "pydantic>=2.0",
    "pydantic-settings[yaml]>=2.0",
    "tokencost>=0.1",
    "dspy>=2.6",
    "tenacity>=8.0",
    "aiolimiter>=1.0",
    "rich>=13.0",
    "structlog>=23.0",
    "tiktoken>=0.5",
    "python-dotenv>=1.2.2",
]

[project.scripts]
agenttree = "agenttree.cli:main"

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"
